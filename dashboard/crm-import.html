function log(msg, cls='info') {
  const el = document.getElementById('log');
  el.style.display = '';
  el.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

async function runImport() {
  const btn = document.getElementById('btn-import');
  const prog = document.getElementById('prog');
  btn.disabled = true;
  prog.style.display = '';
  log(`Aloitetaan tuonti – ${PROSPECTS.length} prospektia…`);

  const BATCH = 20;
  let ok = 0, fail = 0;
  for (let i = 0; i < PROSPECTS.length; i += BATCH) {
    const batch = PROSPECTS.slice(i, i + BATCH);
    const { error } = await db.from('crm_prospects').upsert(batch, { onConflict: 'spara_id' });
    if (error) {
      log(`Erä ${Math.floor(i/BATCH)+1}: VIRHE – ${error.message}`, 'err');
      fail += batch.length;
    } else {
      ok += batch.length;
      log(`✓ ${ok}/${PROSPECTS.length} tuotu`, 'ok');
    }
    prog.value = ok + fail;
  }

  if (fail === 0) {
    log(`\n✅ Kaikki ${ok} prospektia tuotu onnistuneesti!`, 'ok');
    btn.textContent = '✓ Valmis – siirry CRM:ään';
    btn.onclick = () => location.href = 'crm.html';
    btn.disabled = false;
  } else {
    log(`\n⚠️ ${ok} onnistui, ${fail} epäonnistui.`, 'err');
    btn.disabled = false;
  }
}
